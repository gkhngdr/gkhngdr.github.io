<!DOCTYPE html>
<html>
<head>
  <base href="/footiq/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="FootIQ — Futbol Bilgi Yarışması">
  <meta name="theme-color" content="#061A14">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FootIQ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FootIQ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #061A14; /* alt menünün alt rengi (Fq.pine900): Safari çubuğunun arkası menünün devamı gibi görünür */
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      /* Basılı tutunca (bas-konuş) iPhone'un büyüteç/menü balonu çıkmasın. */
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <!-- Güvenli alan ölçer (çentik / iPhone alt çizgisi): Flutter web bunları
       bildirmez; lib/core/safe_area_web.dart buradan okur. -->
  <div id="fq-safe" aria-hidden="true" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>
  <script>
    window.fqSafeArea = function () {
      var d = document.getElementById('fq-safe');
      if (!d) return [0, 0];
      var s = getComputedStyle(d);
      return [parseFloat(s.paddingTop) || 0, parseFloat(s.paddingBottom) || 0];
    };
    // Flutter açılışta görünüm (viewport) etiketini kendi ayarıyla değiştirip
    // "viewport-fit=cover"ı siliyor; ana ekrana eklenen iPhone uygulamasında
    // oyun alt çizgi bölgesine uzanmıyor, altta boş bant kalıyordu. Geri ekle.
    (function () {
      function fit() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          if (m.content.indexOf('viewport-fit') < 0) m.content += ', viewport-fit=cover';
        });
      }
      new MutationObserver(fit).observe(document.head, { childList: true });
      fit();
    })();
  </script>
  <script>
    // Telefon tarayıcısında çizim yoğunluğu en fazla 2x: Flutter web her kareyi
    // ekran yoğunluğunda çizer (iPhone 3x); 2x'te yük ~yarıya iner, fark zor seçilir.
    (function () {
      var r = window.devicePixelRatio || 1;
      if (r > 2 && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } });
      }
    })();
  </script>
  <!-- GitHub Pages COOP/COEP başlığı veremiyor; bu betik tarayıcıda ekler.
       Böylece hızlı WebAssembly çizicisi (skwasm) açılabilir. -->
  <script src="coi-serviceworker.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
